name: acceptance test

on:
  push:
    branches: [main]

jobs:
  acceptance-test:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make test
        env:
          TF_ACC: 1
          MACKEREL_TEST_DEFAULT_NOTIFICATION_GROUP: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          MACKEREL_API_KEY: ${{ secrets.MACKEREL_API_KEY }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
